<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node.GG - Login & Register</title>
    <!-- Favicon referencing local icon.png with icon.ico fallback -->
    <link rel="icon" type="image/png" href="icon.png" onerror="this.href='icon.ico'">

    <!-- ... -->
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Hidden Driver Checkboxes for Pure CSS Theme & Tabs -->
    <input type="checkbox" id="theme-toggle">
    <input type="radio" id="tab-login" name="form-toggle" checked>
    <input type="radio" id="tab-register" name="form-toggle">

    <div class="app-viewport">
        <!-- Ambient Green Glow -->
        <div class="ambient-glow"></div>

        <!-- Theme Toggle Button -->
        <div class="top-controls">
            <label for="theme-toggle" class="theme-btn-label" title="Alternar Tema">
                <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <span>Tema</span>
            </label>
        </div>

        <!-- Main Window Component -->
        <div class="app-window">
            
            <!-- Window Bar -->
            <div class="window-titlebar">
                <div class="window-title">
                    <picture>
                        <source srcset="icon.png" type="image/png">
                        <img src="icon.ico" alt="Node Icon" onerror="this.src='icon.png'">
                    </picture>
                    Node.GG - Desktop
                </div>
            </div>

            <div class="app-body">
                
                <!-- Left Brand Section -->
                <div class="brand-section">
                    <div class="brand-header">
                        <picture>
                            <source srcset="icon.png" type="image/png">
                            <img src="icon.ico" alt="Node Icon" class="brand-icon-small" onerror="this.src='icon.png'">
                        </picture>
                        <div>
                            <div class="brand-title">Node<span style="color:var(--primary)">.GG</span></div>
                            <div class="brand-subtitle">Voz, Chat & Comunidades</div>
                        </div>
                    </div>

                    <!-- Main App Icon Graphic Area -->
                    <div class="mascot-wrapper">
                        <picture>
                            <source srcset="icon.png" type="image/png">
                            <img src="icon.ico" alt="Node App Icon" class="app-icon-main" onerror="this.src='icon.png'">
                        </picture>
                        <div class="mascot-tagline">Conecte-se com o seu squad</div>
                        <div class="mascot-desc">Chamadas de alta qualidade e mensagens em tempo real no PC e Mobile.</div>
                    </div>

                    <!-- Fast QR Scan Login -->
                    <div class="qr-section">
                        <div class="qr-code">
                            <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#121517" stroke-width="2">
                                <path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 15h3v3h-3zM18 18h3v3h-3zM15 18h3v3h-3zM18 15h3v3h-3z"/>
                            </svg>
                        </div>
                        <div class="qr-text">
                            <strong>Entrar via QR Code</strong>
                            Escaneie pelo aplicativo mobile para entrar instantaneamente.
                        </div>
                    </div>
                </div>

                <!-- Right Form Section -->
                <div class="form-section">
                    
                    <div class="form-tabs">
                        <label for="tab-login" class="tab-btn tab-login-label">Entrar</label>
                        <label for="tab-register" class="tab-btn tab-register-label">Criar Conta</label>
                    </div>

                    <!-- Area Global de Mensagens de Erro/Sucesso -->
                    <div id="auth-feedback" style="display: none; font-size: 0.85rem; padding: 10px; border-radius: 6px; margin-bottom: 12px; text-align: center;"></div>

                    <!-- Login Form -->
                    <div class="form-container login-form-wrapper">
                        <form id="form-login">
                            <div class="input-group">
                                <label class="input-label">E-mail ou Usuário</label>
                                <input type="text" id="login-identifier" class="input-field" placeholder="seuemail@exemplo.com ou usuário" required>
                            </div>

                            <div class="input-group">
                                <label class="input-label">Senha</label>
                                <input type="password" id="login-password" class="input-field" placeholder="••••••••••••" required>
                            </div>

                            <div class="form-row">
                                <label class="checkbox-container">
                                    <input type="checkbox" id="login-remember" checked>
                                    <span>Lembrar de mim</span>
                                </label>
                                <a href="#" class="forgot-link">Esqueceu a senha?</a>
                            </div>

                            <button type="submit" id="btn-login-submit" class="btn-submit">Entrar no Node</button>
                        </form>

                        <div class="form-footer">
                            Não tem uma conta? <label for="tab-register">Registre-se agora</label>
                        </div>
                    </div>

                    <!-- Registration Form -->
                    <div class="form-container register-form-wrapper">
                        <form id="form-register">
                            <div class="input-group">
                                <label class="input-label">Nome de Usuário (ID)</label>
                                <input type="text" id="reg-username" class="input-field" placeholder="ex: jaguaringa_99" required>
                            </div>

                            <div class="input-group">
                                <label class="input-label">E-mail</label>
                                <input type="email" id="reg-email" class="input-field" placeholder="seuemail@exemplo.com" required>
                            </div>

                            <div class="input-group">
                                <label class="input-label">Senha</label>
                                <input type="password" id="reg-password" class="input-field" placeholder="Crie uma senha forte" required>
                            </div>

                            <div class="form-row">
                                <label class="checkbox-container">
                                    <input type="checkbox" id="reg-terms" required>
                                    <span>Li e aceito os <a href="#" class="forgot-link">Termos</a></span>
                                </label>
                            </div>

                            <button type="submit" id="btn-register-submit" class="btn-submit">Criar Minha Conta</button>
                        </form>

                        <div class="form-footer">
                            Já possui uma conta? <label for="tab-login">Fazer Login</label>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Script da Aplicação -->
    <script src="./login.js"></script>
</body>
</html>
