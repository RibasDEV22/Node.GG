<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Node.GG - Dashboard</title>
    <link rel="icon" type="image/png" href="../login/icon.png" onerror="this.href='../login/icon.ico'">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="app-container">

        <!-- Header Mobile -->
        <header class="mobile-header">
            <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Abrir menu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="mobile-brand">
                <img src="../login/icon.png" alt="Node" class="brand-icon" onerror="this.style.display='none'">
                <span>Node<span class="highlight">.GG</span></span>
            </div>
            <button class="icon-btn mobile-profile-btn" onclick="openModal('settings')" aria-label="Configurações">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
        </header>

        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <div class="sidebars-container" id="sidebars-container">
            <nav class="servers-sidebar">
                <button class="server-icon active" title="Início">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                </button>
            </nav>

            <aside class="sub-sidebar">
                <div class="sub-sidebar-header">
                    <div class="brand-title">
                        <img src="../login/icon.png" alt="Node Icon" class="logo-icon" onerror="this.style.display='none'">
                        <h2>Node<span class="highlight">.GG</span></h2>
                    </div>
                </div>

                <div class="sidebar-scrollable">
                    <div class="menu-section">
                        <span class="menu-title">Navegação</span>
                        <button class="menu-item active">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
                            <span>Amigos</span>
                        </button>
                        <button class="menu-item" onclick="openModal('chat')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                            <span>Abrir Chat</span>
                        </button>
                    </div>
                </div>

                <!-- Perfil do Usuário Autenticado -->
                <div class="user-profile-card">
                    <div class="avatar-wrapper">
                        <div class="avatar-placeholder" id="user-avatar-text">--</div>
                        <span class="status-indicator online"></span>
                    </div>
                    <div class="user-info">
                        <div class="user-name" id="user-display-name">Carregando...</div>
                        <div class="user-tag" id="user-username">@...</div>
                    </div>
                    <div class="user-actions">
                        <button class="icon-btn" onclick="openModal('settings')" title="Configurações">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        </button>
                    </div>
                </div>
            </aside>
        </div>

        <main class="main-content">
            <header class="content-header">
                <div class="header-left">
                    <div class="header-title">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
                        <span>Painel de Amigos</span>
                    </div>
                    <div class="filter-tabs">
                        <button class="tab-btn active" data-tab="all">Todos</button>
                        <button class="tab-btn" data-tab="online">Online</button>
                        <button class="tab-btn" data-tab="requests">Pedidos</button>
                    </div>
                </div>

                <div class="header-right">
                    <div class="search-bar">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="search-input" placeholder="Buscar utilizadores...">
                    </div>
                </div>
            </header>

            <div class="dashboard-scrollable">
                <section class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon green">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                        </div>
                        <div class="stat-info">
                            <span class="stat-value" id="online-count">0</span>
                            <span class="stat-label">Conectados Agora</span>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon purple">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
                        </div>
                        <div class="stat-info">
                            <span class="stat-value" id="friends-count">0</span>
                            <span class="stat-label">Total de Amigos</span>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon blue">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
                        </div>
                        <div class="stat-info">
                            <span class="stat-value" id="ping-value">-- ms</span>
                            <span class="stat-label">Latência da Rede</span>
                        </div>
                    </div>
                </section>

                <section class="users-view">
                    <div class="section-header">
                        <span class="section-title">UTILIZADORES E ATIVIDADE</span>
                    </div>
                    
                    <div class="users-list" id="users-container">
                        <!-- Carregado inteiramente via JS -->
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Modal para Chat / Configurações -->
    <div id="app-modal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <header class="modal-header">
                <span class="modal-title">Node.GG</span>
                <button id="close-modal-btn" class="modal-close-btn" aria-label="Fechar">&times;</button>
            </header>
            <div class="modal-body">
                <iframe id="modal-iframe" src="" frameborder="0"></iframe>
            </div>
        </div>
    </div>

    <script>
        const mobileToggle = document.getElementById('mobile-menu-toggle');
        const overlay = document.getElementById('sidebar-overlay');
        const sidebarsContainer = document.getElementById('sidebars-container');

        function toggleMobileMenu() {
            const isOpen = sidebarsContainer.classList.contains('mobile-active');
            if (isOpen) {
                sidebarsContainer.classList.remove('mobile-active');
                overlay.classList.remove('active');
            } else {
                sidebarsContainer.classList.add('mobile-active');
                overlay.classList.add('active');
            }
        }

        if (mobileToggle) mobileToggle.addEventListener('click', toggleMobileMenu);
        if (overlay) overlay.addEventListener('click', toggleMobileMenu);
    </script>
    <script src="dashboard.js"></script>
</body>
</html>
