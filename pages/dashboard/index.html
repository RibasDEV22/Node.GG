<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node.GG - Dashboard</title>
    <link rel="icon" type="image/png" href="../login/icon.png" onerror="this.href='../login/icon.ico'">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-viewport">
        <div class="ambient-glow"></div>

        <!-- Layout Principal da Janela Desktop -->
        <div class="app-window">
            
            <!-- Barra Superior de Título -->
            <div class="window-titlebar">
                <div class="window-title">
                    <img src="../login/icon.png" alt="Node Icon" onerror="this.src='../login/icon.ico'">
                    Node.GG - Dashboard
                </div>
                <div class="window-actions">
                    <button class="win-btn" title="Minimizar">&#8211;</button>
                    <button class="win-btn" title="Maximizar">&#9633;</button>
                    <button class="win-btn close-btn" title="Fechar">&#10005;</button>
                </div>
            </div>

            <div class="app-body">
                
                <!-- 1. BARRA DE NAVEGAÇÃO DE SERVIDORES / GRUPOS -->
                <nav class="servers-sidebar">
                    <button class="server-icon active" title="Início / Home">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                    </button>
                    <div class="server-divider"></div>
                    
                    <!-- Grupos/Servidores de Exemplo -->
                    <div class="server-icon" title="Dev Squad 🚀">
                        <span>DS</span>
                    </div>
                    <div class="server-icon" title="Comunidade Gaming 🎮">
                        <span>CG</span>
                    </div>
                    <div class="server-icon" title="Unreal & Unity 🕹️">
                        <span>UU</span>
                    </div>

                    <button class="server-icon add-server-btn" title="Criar ou Entrar em um Grupo">
                        <span>+</span>
                    </button>
                </nav>

                <!-- 2. PAINEL DE AMIGOS E CANAIS DA COMUNIDADE -->
                <aside class="sub-sidebar">
                    <div class="sub-sidebar-header">
                        <h2>Node<span style="color:var(--primary)">.GG</span></h2>
                    </div>

                    <div class="menu-section">
                        <span class="menu-title">Navegação</span>
                        <button class="menu-item active">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                            Amigos
                        </button>
                        <button class="menu-item" onclick="openModal('chat')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                            Abrir Chat
                        </button>
                    </div>

                    <!-- Lista de Grupos Rápidos -->
                    <div class="menu-section">
                        <span class="menu-title">Meus Grupos</span>
                        <div class="group-item">
                            <span class="group-hash">#</span> geral-devs
                        </div>
                        <div class="group-item">
                            <span class="group-hash">#</span> matchmaking-pvp
                        </div>
                    </div>

                    <!-- CARD DO PERFIL LOGADO (RODAPÉ DA SIDEBAR) -->
                    <div class="user-profile-card">
                        <div class="avatar-wrapper">
                            <div class="avatar-placeholder" id="user-avatar-text">U</div>
                            <span class="status-indicator online"></span>
                        </div>
                        <div class="user-info">
                            <div class="user-name" id="user-display-name">Carregando...</div>
                            <div class="user-tag" id="user-username">@usuario</div>
                        </div>
                        <button class="icon-btn" onclick="openModal('settings')" title="Configurações">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        </button>
                    </div>
                </aside>

                <!-- 3. ÁREA PRINCIPAL (LISTA DE USUÁRIOS & ATIVIDADES) -->
                <main class="main-content">
                    
                    <!-- Topbar da Área Conteúdo -->
                    <header class="content-header">
                        <div class="header-title">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
                            <span>Lista de Usuários</span>
                        </div>
                        <div class="search-bar">
                            <input type="text" placeholder="Buscar amigos ou usuários...">
                        </div>
                    </header>

                    <!-- Lista de Usuários On-line/Membros -->
                    <div class="users-view">
                        <div class="section-title">ONLINE — <span id="online-count">3</span></div>
                        
                        <div class="users-list" id="users-container">
                            <!-- Card de Usuário Exemplo 1 -->
                            <div class="user-card">
                                <div class="avatar-wrapper">
                                    <div class="avatar-placeholder alt1">J</div>
                                    <span class="status-indicator online"></span>
                                </div>
                                <div class="user-details">
                                    <div class="user-title">Jaguaringa_99</div>
                                    <div class="user-status-text">Criando engine 3D em WebGL 🚀</div>
                                </div>
                                <button class="btn-action" onclick="openModal('chat')">Conversar</button>
                            </div>

                            <!-- Card de Usuário Exemplo 2 -->
                            <div class="user-card">
                                <div class="avatar-wrapper">
                                    <div class="avatar-placeholder alt2">R</div>
                                    <span class="status-indicator idle"></span>
                                </div>
                                <div class="user-details">
                                    <div class="user-title">RibasDEV</div>
                                    <div class="user-status-text">Otimizando emulador no Android</div>
                                </div>
                                <button class="btn-action" onclick="openModal('chat')">Conversar</button>
                            </div>

                            <!-- Card de Usuário Exemplo 3 -->
                            <div class="user-card">
                                <div class="avatar-wrapper">
                                    <div class="avatar-placeholder alt3">S</div>
                                    <span class="status-indicator dnd"></span>
                                </div>
                                <div class="user-details">
                                    <div class="user-title">SquadLeader</div>
                                    <div class="user-status-text">Não perturbe — Jogando Clash Royale</div>
                                </div>
                                <button class="btn-action" onclick="openModal('chat')">Conversar</button>
                            </div>

                        </div>
                    </div>

                </main>

            </div>
        </div>
    </div>

    <!-- MODAL REUTILIZÁVEL PARA JANELAS INTERNAS (CHAT, SETTINGS, PROFILE) -->
    <div id="app-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button id="close-modal-btn" class="modal-close-btn">&times;</button>
            <iframe id="modal-iframe" src="" frameborder="0"></iframe>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
