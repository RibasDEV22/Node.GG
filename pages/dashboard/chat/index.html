<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0b141a"
    >

    <title>Node.GG - Chat</title>

    <!-- =====================================================
         FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- =====================================================
         CHAT CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div
        class="chat-container"
        id="chat-container"
    >

        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside
            class="chat-sidebar"
            id="chat-sidebar"
        >

            <!-- Sidebar Header -->

            <div class="chat-header">

                <div class="chat-header-title">

                    <h2>
                        Mensagens
                    </h2>

                </div>

            </div>


            <!-- Search -->

            <div class="search-bar">

                <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >

                    <circle
                        cx="11"
                        cy="11"
                        r="8"
                    ></circle>

                    <line
                        x1="21"
                        y1="21"
                        x2="16.65"
                        y2="16.65"
                    ></line>

                </svg>


                <input
                    type="text"
                    id="chat-search-input"
                    placeholder="Buscar conversa..."
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Buscar conversa"
                >

            </div>


            <!-- Conversations -->

            <div
                class="conversations-list"
                id="conversations-list"
            >

                <!--
                    Preenchido dinamicamente pelo chat.js
                -->

            </div>

        </aside>


        <!-- =================================================
             MAIN CHAT
        ================================================== -->

        <main
            class="chat-main"
            id="chat-main"
        >


            <!-- =============================================
                 EMPTY STATE
            ============================================== -->

            <div
                class="chat-area"
                id="chat-area"
            >

                <div class="chat-empty">

                    <svg
                        width="48"
                        height="48"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >

                        <path
                            d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
                        ></path>

                    </svg>


                    <span>
                        Selecione uma conversa para começar
                    </span>

                </div>

            </div>


            <!-- =============================================
                 ACTIVE CHAT
            ============================================== -->

            <section
                class="chat-conversation"
                id="chat-conversation"
                style="display: none;"
            >


                <!-- =========================================
                     ACTIVE CHAT HEADER
                ========================================== -->

                <header
                    class="chat-header-active"
                    id="chat-header"
                >

                    <div class="chat-header-info">


                        <!-- Mobile Back Button -->

                        <button
                            type="button"
                            class="chat-back-btn"
                            id="chat-back-btn"
                            aria-label="Voltar para conversas"
                            title="Voltar"
                        >

                            <svg
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >

                                <polyline
                                    points="15 18 9 12 15 6"
                                ></polyline>

                            </svg>

                        </button>


                        <!-- Avatar -->

                        <div
                            class="avatar-small"
                            id="chat-avatar"
                            aria-hidden="true"
                        >
                            U
                        </div>


                        <!-- User Information -->

                        <div class="chat-user-info">

                            <h3 id="chat-username">
                                Usuário
                            </h3>

                            <span
                                class="status-text"
                                id="chat-status"
                            >
                                offline
                            </span>

                        </div>

                    </div>

                </header>


                <!-- =========================================
                     MESSAGES
                ========================================== -->

                <div
                    class="messages-container"
                    id="messages-container"
                >

                    <!--
                        Preenchido dinamicamente pelo chat.js
                    -->

                </div>


                <!-- =========================================
                     MESSAGE INPUT
                ========================================== -->

                <div
                    class="chat-input-area"
                    id="chat-input-area"
                >

                    <div class="input-wrapper">


                        <input
                            type="text"
                            id="message-input"
                            placeholder="Escreva uma mensagem..."
                            autocomplete="off"
                            spellcheck="true"
                            maxlength="4000"
                            aria-label="Mensagem"
                        >


                        <button
                            type="button"
                            class="send-btn"
                            id="send-btn"
                            title="Enviar (Enter)"
                            aria-label="Enviar mensagem"
                        >

                            <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="currentColor"
                                aria-hidden="true"
                            >

                                <path
                                    d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"
                                ></path>

                            </svg>

                        </button>

                    </div>

                </div>


            </section>


        </main>

    </div>


    <!-- =====================================================
         CHAT JAVASCRIPT
    ====================================================== -->

    <script src="chat.js"></script>

</body>

</html>
